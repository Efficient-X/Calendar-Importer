name: Bug report
description: Tell us what went wrong without sharing private calendar data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: input
    id: plugin-version
    attributes:
      label: Calendar Importer version
      placeholder: 1.1.0
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Windows
        - macOS
        - Linux
        - iPhone
        - iPad
        - Android
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: Calendar provider
      options:
        - Google Calendar
        - Microsoft Outlook or Microsoft 365
        - Apple iCloud
        - Zoho Calendar
        - Other iCal or ICS provider
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the steps, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: Sanitized error
      description: Remove calendar URLs, event contents, email addresses, and tokens first.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have not included a private calendar URL or private calendar contents.
          required: true
